version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: vercel-postgres
    ports:
      - "5432:5432"
    environment:
      # Dev defaults; override via the environment (or a .env beside this file)
      # rather than editing them in here.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vercel}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data
volumes:
  pg_data:
